services:
  - type: web
    name: ss-spark-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/fast
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: ss_spark
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: USE_QDRANT
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ── AI Provider Router ─────────────────────────────────────────────
      - key: AI_ROUTING_MODE
        value: fast
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "5"
      - key: AI_PROVIDER_COOLDOWN_SECONDS
        value: "30"
      - key: GEMINI_MODEL
        value: ""
      - key: OPENAI_MODEL
        value: ""
      - key: NVIDIA_MODEL
        value: ""
      - key: OPENROUTER_MODEL
        value: ""
      - key: GEMINI_API_KEY_2
        sync: false
      - key: OPENAI_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: CUSTOM_PROVIDER_NAME
        sync: false
      - key: CUSTOM_PROVIDER_BASE_URL
        sync: false
      - key: CUSTOM_PROVIDER_API_KEY
        sync: false
      - key: CUSTOM_MODEL
        sync: false
