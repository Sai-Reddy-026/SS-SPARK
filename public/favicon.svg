<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pg-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFAE00"/>
    </linearGradient>
    <linearGradient id="pg-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="pg-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="pg-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <filter id="pg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF6B00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Tile Background (Obsidian Black with Orange Border Glow) -->
  <rect width="64" height="64" rx="16" fill="url(#pg-bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#pg-orange-grad)" stroke-width="1.8"/>

  <!-- Document Body with Folded Corner -->
  <g filter="url(#pg-shadow)">
    <!-- Base paper path with top-right fold cutout -->
    <path d="M17 13 C17 11.895 17.895 11 19 11 H36 L47 22 V49 C47 50.105 46.105 51 45 51 H19 C17.895 51 17 50.105 17 49 Z" fill="url(#pg-paper)"/>
    <!-- Folded corner tab -->
    <path d="M36 11 V19 C36 20.657 37.343 22 39 22 H47 Z" fill="#E2E8F0"/>
  </g>

  <!-- Analysis / Document Content Lines (Electric Orange Accents) -->
  <rect x="22" y="24" width="11" height="2.5" rx="1.25" fill="#FF6B00"/>
  <rect x="22" y="29.5" width="18" height="2.5" rx="1.25" fill="#94A3B8"/>
  <rect x="22" y="35" width="13" height="2.5" rx="1.25" fill="#94A3B8"/>

  <!-- AI Genius Sparkles (Warm Gold/Amber) -->
  <g transform="translate(30, 31)">
    <!-- Main 4-point AI Star -->
    <path d="M9 0 Q9 7 16 7 Q9 7 9 14 Q9 7 2 7 Q9 7 9 0 Z" fill="url(#pg-sparkle)"/>
    <circle cx="9" cy="7" r="1.5" fill="#FFFFFF"/>
    <!-- Secondary small sparkle -->
    <path d="M15 -2 Q15 0.5 17.5 0.5 Q15 0.5 15 3 Q15 0.5 12.5 0.5 Q15 0.5 15 -2 Z" fill="#FFC837"/>
  </g>
</svg>
