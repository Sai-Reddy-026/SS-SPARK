<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5700"/>
      <stop offset="50%" stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>

  <!-- Electric Orange Squircle Background -->
  <rect width="100" height="100" rx="28" fill="url(#spark-grad)"/>

  <!-- AI Brain and Circuit Traces (Crisp Pure White) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Brain Hemisphere Profile -->
    <path d="M 48 26
             C 38 26, 31 32, 32 40
             C 24 43, 24 54, 31 59
             C 30 67, 38 74, 48 74" />

    <!-- Central Vertical Brain Axis -->
    <path d="M 48 26 V 74" />

    <!-- Inner Brain Cortex Fold -->
    <path d="M 48 64 C 40 64, 38 56, 43 51 C 46 48, 48 48, 48 48" />

    <!-- Top Neural Circuit Branch -->
    <path d="M 48 37 H 57 V 32 H 63" />

    <!-- Middle Neural Circuit Branch -->
    <path d="M 48 52 H 63" />

    <!-- Bottom Neural Circuit Branch -->
    <path d="M 48 66 H 57 V 71 H 63" />
  </g>

  <!-- Neural Terminal Node Circles -->
  <circle cx="68" cy="32" r="3.6" fill="#FFFFFF" />
  <circle cx="68" cy="52" r="3.6" fill="#FFFFFF" />
  <circle cx="68" cy="71" r="3.6" fill="#FFFFFF" />
</svg>
